<script>
/* Widgets post their document height; the book page owns its iframes, so it can
   listen and resize. This is the mechanism the notebook helper cannot use, which
   is why show() takes an explicit height instead.

   Also forwards the reader's theme choice into each iframe, so a widget matches
   the page it sits on rather than only the OS setting. */
(function () {
  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.type !== "statml:height") return;
    var frames = document.querySelectorAll('iframe[data-statml="' + data.slug + '"]');
    for (var i = 0; i < frames.length; i += 1) {
      if (frames[i].contentWindow === event.source) {
        frames[i].style.height = data.height + "px";
      }
    }
  });

  function syncTheme() {
    var attr = document.documentElement.getAttribute("data-bs-theme");
    if (attr !== "dark" && attr !== "light") return;
    document.querySelectorAll("iframe[data-statml]").forEach(function (frame) {
      var next = new URL(frame.src, location.href);
      if (next.searchParams.get("theme") === attr) return;
      next.searchParams.set("theme", attr);
      frame.src = next.toString();
    });
  }

  new MutationObserver(syncTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-bs-theme"],
  });
  syncTheme();
})();
</script>
