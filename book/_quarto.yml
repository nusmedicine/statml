project:
  type: book
  output-dir: _book

book:
  title: "Statistics and Machine Learning, Interactively"
  subtitle: "A widget-first companion"
  author: "Kenneth Ban"
  search: true
  chapters:
    - index.qmd
    - chapters/clt.qmd

# The {{< widget ... >}} shortcode. Mirrors the Python helper deliberately:
#   book:     {{< widget clt dist=bimodal n=30 >}}
#   notebook: show("clt", dist="bimodal", n=30)
shortcodes:
  - assets/widget.lua

format:
  html:
    theme: cosmo
    toc: true
    include-in-header: assets/head.html
    include-after-body: assets/embed.html
